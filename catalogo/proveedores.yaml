# REACONDICIONADO
# =====================================================================================

- id: reacondicionadores-ca
  nombre: Reacondicionadores canadienses de equipo empresarial
  tipo: reacondicionador
  provincias: [ON, QC]
  requiere_cuenta_corporativa: null
  requiere_licencia: false
  categorias_que_surte: [computo]
  contacto_url: null
  cuenta_abierta: false
  notas: >-
    Entrada generica a proposito: hay que seleccionar y calificar al menos dos proveedores concretos
    de escritorios empresariales fuera de arrendamiento. Criterios de calificacion: garantia ofrecida,
    consistencia de generacion de procesador entre lotes, disponibilidad sostenida del mismo modelo y
    tiempo de reposicion. La continuidad de modelo importa mas que el precio unitario, porque las
    plantillas del stack asumen una plataforma conocida.
