# =====================================================================================

- id: adi-global-canada
  nombre: ADI Global Distribution Canada
  tipo: distribucion_seguridad
  provincias: [ON, QC]
  requiere_cuenta_corporativa: true
  requiere_licencia: null          # confirmar si exige licencia de agencia de seguridad privada
  categorias_que_surte: [camara, sensor, sirena, cableado, red, coordinador, termostato]
  contacto_url: null
  cuenta_abierta: false
  notas: >-
    Canal principal para camaras de gama premium (Axis, Hanwha), sensores, cableado, racks y catalogo
    Z-Wave. Verificar los requisitos de apertura de cuenta: numero de empresa, prueba de seguro y
    posiblemente licencia.

