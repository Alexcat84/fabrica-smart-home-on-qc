# Registro de proveedores
#
# ADR-001: `contacto_url` va en `null` hasta que alguien lo confirme; `cuenta_abierta: false` hasta
# que la cuenta este realmente abierta y operativa.
#
# Regla comercial del plan de negocio (cap. 6.16): las cuentas de distribucion se abren ANTES del
# primer proyecto pagado, no despues. La diferencia entre precio de distribuidor y precio de retail
# es con frecuencia la diferencia entre un margen bruto viable y uno inviable, y varias cuentas
# exigen numero de empresa, prueba de seguro y, en algunos casos, licencia.
#
# Esquema:
#   id, nombre, tipo, provincias, requiere_cuenta_corporativa, requiere_licencia,
#   categorias_que_surte, contacto_url, cuenta_abierta, notas
#
# tipo: distribucion_seguridad | distribucion_electrica | fabricante_directo | retail_ti |
#       reacondicionador
---

