# Paquete L - Premium
#
# Fuente: cap. 8.1, 8.2.1, 8.3.2 y 8.5 del plan de negocio.
# ADR-001: los valores de proyecto son INDICATIVOS. No se cotiza con ellos.
---
id: L
nombre: Premium
propiedad_objetivo: Vivienda aislada grande, varios niveles, edificacion secundaria

capacidad:
  dispositivos_automatizados_min: 60
  dispositivos_automatizados_max: 120
  camaras_min: 7
  camaras_max: 12
  resolucion_camaras: 4K

retencion:
  continua_dias: 14
  eventos_dias: 60
  eventos_dias_max: 90
  politica: hibrida

controlador:
  tipo: escritorio de formato reducido con bahia de almacenamiento discreta
  ram_gb_min: 32
  ram_gb_max: 32
  candidatos: [dell-optiplex-micro-reacondicionado, lenovo-thinkcentre-tiny-reacondicionado, hp-elitedesk-mini-reacondicionado]
  inferencia: grafica Intel integrada (OpenVINO)

almacenamiento:
  nvme_sistema_gb: 500
  vigilancia_tb: 24            # dos unidades de 12 TB en espejo
  redundancia: espejo
  candidatos: [nvme-sistema, wd-purple-vigilancia, seagate-skyhawk-vigilancia]
  notas: >-
    Espejo de dos unidades de 12 TB: la capacidad util es 12 TB. La redundancia protege frente a fallo
    de disco y NO es respaldo. Se le dice al cliente por escrito.

red:
  gateway: 1
  switch_poe_puertos: 24
  puntos_acceso_min: 3
  puntos_acceso_max: 4
  candidatos: [unifi-gateway, switch-poe-plus-24, punto-acceso-wifi]
  patch_panel_obligatorio: true

energia:
  ups_va: 1500
  ups_camaras_dedicado: true
  circuito_dedicado_rack: true
  candidatos: [ups-cyberpower-senoidal, ups-apc-senoidal]
  carga_rack_w_min: 220
  carga_rack_w_max: 400
  notas: >-
    UPS dedicado para el subsistema de camaras y grabacion, con objetivo de autonomia de dos a cuatro
    horas. Cubre el escenario de corte deliberado de energia, que es el unico que importa de verdad en
    un sistema de camaras.
  failover_celular_recomendado: true

vlans:
  cantidad: 6
  presentes: [10, 20, 30, 40, 50, 60]
  ausentes: []
  resuelto_por: ADR-009
  notas: >-
    Segmentacion completa. L es el PRIMER nivel con Management (50) como VLAN separada
    (ADR-009): a partir de aqui el numero de equipos de red gestionados justifica el
    segmento propio.

internet_minimo:
  bajada_mbps: 100
  subida_mbps: 25
  motivo: Varios visores remotos simultaneos, revision del stream principal y hogar mas numeroso.
  notas: >-
    Verificar la traduccion de direcciones del proveedor: la de nivel de operador impide establecer
    tunel directo y fuerza conexion relevada, con latencia adicional. Puede hacer falta direccion
    estatica u otro nivel de servicio.

esfuerzo:
  instalacion_dias_min: 7
  instalacion_dias_max: 12

comercial:
  valor_proyecto_cad_min: 15000
  valor_proyecto_cad_max: 30000
  plan_cuidado_cad_mes: 65
  verificado: false
  notas: Indicativo.
