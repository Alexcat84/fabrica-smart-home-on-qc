    deteccion_personas: true
    zonas: []
    mascaras: []

# =================================================================================================
# PoE
# =================================================================================================
poe:
  # Peor caso 99 W (3 camaras 4K con IR + 2 camaras 2K + 2 puntos de acceso + coordinador).
  # Con el 40 % de holgura exigido: 138,6 W. Un switch de 120 W NO vale, aunque parezca sobrado:
  # la primera noche de invierno con el infrarrojo a plena potencia se queda corto y las camaras
  # empiezan a caerse de forma intermitente. Se especifica 180 W.
  presupuesto_switch_w: 180
  otros:
    - nombre: ap_planta_baja
      tipo: punto_acceso
      consumo_w: null
    - nombre: ap_planta_primera
      tipo: punto_acceso
      consumo_w: null
    - nombre: coordinador_zigbee_central
      tipo: coordinador_zigbee
      consumo_w: null

