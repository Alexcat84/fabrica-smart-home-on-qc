# =================================================================================================
# CLIENTE DE DEMOSTRACION - NO ES UNA PROPIEDAD REAL
# =================================================================================================
#
# Existe para que el repositorio se pueda probar de extremo a extremo: validar, generar y revisar el
# paquete completo sin tener un cliente de verdad.
#
# Los registros `certificacion_verificada` de este archivo son FICTICIOS y estan marcados con
# `verificado_por: EJEMPLO-NO-REAL`. `generador/validar.py` solo los acepta porque este archivo
# declara `es_ejemplo: true`; en cualquier otro cliente los rechaza con error, para que este patron
# no se filtre a una instalacion real copiando y pegando.
#
# NO SE COMPRA NADA a partir de este archivo.
---
es_ejemplo: true

cliente:
  id: EJEMPLO-demo
  nombre: "Cliente de demostracion"
  nombre_sistema: "Casa Demo"
  provincia: ON
  ciudad: Ottawa
  idioma: en
  latitud: 45.42
  longitud: -75.70
  elevacion_m: 70

paquete: M

# =================================================================================================
# Red
# =================================================================================================
red:
  octeto: 99                   # el 99 queda reservado a demostraciones en el registro de la empresa
  dominio_local: casa.local
  zona_horaria: America/Toronto
  bajada_mbps: 150.0           # medidas en el relevamiento
  subida_mbps: 15.0
  margen_hogar_mbps: 5.0
  cgnat: false
  failover_celular: false
  ssid_familia: demo-home
  ssid_iot: demo-iot
  ssid_invitados: demo-guest
  seguridad_wifi: WPA3
  seguridad_wifi_iot: WPA2-AES
  equipo_administrativo: 10.99.10.20
  puertos_trusted_a_iot: [80, 443]

visores_concurrentes: 2
horas_visionado_dia: 1.0

zigbee:
  canal: 25                    # elegido para no solapar con los canales Wi-Fi del sitio
  coordinador_transporte: ethernet
  coordinador_ip_final: 50
  puerto_usb: null
  adaptador: ezsp
  potencia_dbm: 5

soporte:
  duracion_horas: 2
  plano_control: autoalojado

notificaciones:
  modo: push_mitigado

hogar:
  - nombre: "Titular 1"
    dispositivo_movil: demo_iphone
    plataforma: ios
    administrador: true
  - nombre: "Titular 2"
    dispositivo_movil: demo_pixel
    plataforma: android
    administrador: false

# =================================================================================================
# Retencion y almacenamiento
# =================================================================================================
retencion:
  continua_dias: 7
  eventos_dias: 60
  margen: 0.15

almacenamiento:
  nvme_sistema_gb: 500
  vigilancia_tb: 8             # el paquete M especifica 8 TB; el calculo lo confirma
  redundancia: ninguna

# =================================================================================================
# Camaras
# =================================================================================================
# Sub-stream a 0,5 Mbps: es parametro de DISENO. A 1 Mbps, dos visores concurrentes agotarian la
# subida de este sitio (ver docs/POR-VERIFICAR.md, fila M-12).
camaras:
  - nombre: camara_exterior_frente_entrada
    nombre_cliente: "Front door"
    id_catalogo: reolink-poe-camara
    area: exterior_frente
    exterior: true
    ip_final: 11
    mac: CAMBIAR-EN-COMISIONAMIENTO
    puerto_switch: "1"
    etiqueta_cable: PP1-01
    tipo_poe: camara_4k_ir
    consumo_w: null
    clase_poe: 802.3at
    bitrate_principal_mbps: 8.0
    bitrate_substream_mbps: 0.5
    substream_ancho: 640
    substream_alto: 480
    substream_fps: 5
    ruta_principal: /h264Preview_01_main
    ruta_substream: /h264Preview_01_sub
    fraccion_eventos: 0.20     # da a la via publica: mas actividad de la habitual
    descripcion_campo_vision: "Puerta de entrada y camino de acceso, hasta la acera."
    deteccion_personas: true
    zonas:
      - nombre: acceso
        coordenadas: "0,480,640,480,640,300,0,300"
        objetos: [person]
    mascaras:
      - "0,0,640,0,640,120,0,120"   # via publica: fuera del analisis de movimiento

  - nombre: camara_exterior_patio_norte
    nombre_cliente: "Back yard"
    id_catalogo: reolink-poe-camara
    area: exterior_patio
    exterior: true
    ip_final: 12
    mac: CAMBIAR-EN-COMISIONAMIENTO
    puerto_switch: "2"
    etiqueta_cable: PP1-02
    tipo_poe: camara_4k_ir
    consumo_w: null
    clase_poe: 802.3at
    bitrate_principal_mbps: 8.0
    bitrate_substream_mbps: 0.5
    substream_ancho: 640
    substream_alto: 480
    substream_fps: 5
    ruta_principal: /h264Preview_01_main
    ruta_substream: /h264Preview_01_sub
    fraccion_eventos: 0.05
    descripcion_campo_vision: "Patio trasero y puerta del jardin."
    deteccion_personas: true
    zonas: []
    mascaras: []

  - nombre: camara_exterior_lateral_este
    nombre_cliente: "Side path"
    id_catalogo: reolink-poe-camara
    area: exterior_lateral
    exterior: true
    ip_final: 13
    mac: CAMBIAR-EN-COMISIONAMIENTO
    puerto_switch: "3"
    etiqueta_cable: PP1-03
    tipo_poe: camara_4k_ir
    consumo_w: null
    clase_poe: 802.3at
    bitrate_principal_mbps: 4.0
    bitrate_substream_mbps: 0.5
    substream_ancho: 640
    substream_alto: 480
    substream_fps: 5
    ruta_principal: /h264Preview_01_main
    ruta_substream: /h264Preview_01_sub
    fraccion_eventos: 0.05
    descripcion_campo_vision: "Paso lateral este, entre la casa y la valla."
    deteccion_personas: true
    zonas: []
    mascaras: []

  - nombre: camara_garaje_interior
    nombre_cliente: "Garage"
    id_catalogo: reolink-poe-camara
    area: garaje
    exterior: false
    ip_final: 14
    mac: CAMBIAR-EN-COMISIONAMIENTO
    puerto_switch: "4"
    etiqueta_cable: PP1-04
    tipo_poe: camara_2k
    consumo_w: null
    clase_poe: 802.3af
    bitrate_principal_mbps: 4.0
    bitrate_substream_mbps: 0.5
    substream_ancho: 640
    substream_alto: 480
    substream_fps: 5
    ruta_principal: /h264Preview_01_main
    ruta_substream: /h264Preview_01_sub
    fraccion_eventos: 0.05
    descripcion_campo_vision: "Interior del garaje, puerta basculante y puerta de servicio."
    deteccion_personas: true
    zonas: []
    mascaras: []

  - nombre: camara_exterior_terraza
    nombre_cliente: "Deck"
    id_catalogo: reolink-poe-camara
    area: exterior_patio
    exterior: true
    ip_final: 15
    mac: CAMBIAR-EN-COMISIONAMIENTO
    puerto_switch: "5"
    etiqueta_cable: PP1-05
    tipo_poe: camara_2k
    consumo_w: null
