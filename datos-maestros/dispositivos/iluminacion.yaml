  precio_lista_cad: null
  precio_distribuidor_cad: null
  paquetes: [S, M, L, XL]
  estado: excepcion_documentada
  notas: >-
    EXCEPCION DOCUMENTADA, no solucion de referencia (ADR-003, enmienda de 2026-08-19). Introduce un
    puente propietario adicional con registro en la nube del fabricante, lo que choca con la regla de
    control local sin cuenta y con la de red unica de radio. Se especifica solo cuando el arbol de
    ADR-008 llega a la rama "sin neutro, con espacio" y ninguna alternativa certificada de un solo
    ecosistema sirve para ese circuito; se registra el motivo en el archivo de cliente y se declara
    al cliente por escrito en el as-built. Condicionada a la fila A-02 de docs/POR-VERIFICAR.md: si
    se resuelve en contra, pasa al registro de exclusion. Verificar ademas la compatibilidad de la
    lampara LED concreta contra la lista publicada del atenuador antes de cotizar. Sembrado del
    cap. 6.3.4 del plan de negocio.
  fuente_url: null
  verificado: false

