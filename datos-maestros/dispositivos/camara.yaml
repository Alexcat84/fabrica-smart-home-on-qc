# Categoria: camara
#
# Un archivo por categoria. El esquema comun del registro esta en `_ESQUEMA.md` y su
# version ejecutable en `../esquemas/dispositivo.schema.json`, que el validador aplica:
# un campo mal escrito se rechaza, no se ignora.
#
# Reglas que gobiernan este archivo: ADR-001 (no se inventan datos), ADR-002
# (certificacion canadiense para instalacion fija), ADR-003 (control local sin nube),
# ADR-004 (nada de seguridad de vida). Ver docs/DECISIONES.md.
