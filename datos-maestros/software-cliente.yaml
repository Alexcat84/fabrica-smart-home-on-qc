  obligacion_licencia: aviso
  sustituible_por: [influxdb]
  paquetes: [M, L, XL]
  notas: >-
    Preferible cuando el almacenamiento del controlador esta ajustado.

- id: grafana
  nombre: Grafana
  licencia: AGPL-3.0
  repo_url: https://github.com/grafana/grafana
  version_fijada: null
  rol: Paneles de historico de energia y ambiente.
  obligacion_licencia: fuente_si_modificado
  sustituible_por: []
  paquetes: [M, L, XL]
  notas: >-
    AGPL-3.0. No se modifica: los paneles se definen como configuracion, que no es obra derivada.

- id: uptime-kuma
  nombre: Uptime Kuma
  licencia: MIT
  repo_url: https://github.com/louislam/uptime-kuma
