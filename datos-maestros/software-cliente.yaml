- id: nut
  nombre: Network UPS Tools
  licencia: GPL-2.0
  repo_url: https://github.com/networkupstools/nut
  version_fijada: null
  rol: Estado del sistema de alimentacion ininterrumpida y apagado ordenado.
  obligacion_licencia: fuente_si_modificado
  sustituible_por: []
