# Catalogo de componentes de software
#
# ADR-003: ningun componente puede requerir cuenta en la nube de un fabricante para funcionar.
# ADR-006: las versiones se fijan y las actualizaciones automaticas quedan deshabilitadas. Mientras
#          `version_fijada` sea `null`, la version aun no se ha validado en el banco de la empresa.
#
# `obligacion_licencia` resume la obligacion practica al ENTREGAR el software en hardware vendido al
# cliente, que es distribucion en el sentido legal de estas licencias:
#   - aviso              : conservar avisos de copyright y de licencia; entregar apendice de licencias
#   - fuente_si_modificado: si LO MODIFICAMOS y lo entregamos, hay que ofrecer la fuente correspondiente
#   - ninguna            : sin obligacion practica adicional
#
# La politica completa vive en docs/LICENCIAS.md. Resumen: NO forkeamos.
#
# Fuente de siembra: cap. 7.1 y 7.2 del plan de negocio.
#
# Esquema:
#   id, nombre, licencia, repo_url, version_fijada, rol, obligacion_licencia, sustituible_por,
#   paquetes, notas
---

- id: home-assistant-os
  nombre: Home Assistant Operating System
  licencia: Apache-2.0
  repo_url: https://github.com/home-assistant/operating-system
  version_fijada: null
  rol: Base gestionada del anfitrion, con actualizaciones supervisadas y aislamiento de complementos.
  obligacion_licencia: aviso
  sustituible_por: [linux-minimo-con-contenedores]
  paquetes: [S, M, L, XL]
  notas: >-
    Alternativa: anfitrion Linux minimo ejecutando contenedores, que es lo que se usa cuando el mismo
    equipo hace de controlador y de grabador. La eleccion se registra en el archivo de cliente.

- id: home-assistant-core
  nombre: Home Assistant Core
  licencia: Apache-2.0
  repo_url: https://github.com/home-assistant/core
  version_fijada: null
  rol: Estado de dispositivos, logica de automatizacion, interfaz de usuario y backend de la app movil.
  obligacion_licencia: aviso
  sustituible_por: []
  paquetes: [S, M, L, XL]
  notas: >-
    Nucleo del sistema. Version fijada, actualizacion deliberada tras validacion en banco, con
    instantanea previa y procedimiento de reversion documentado.

- id: mosquitto
  nombre: Eclipse Mosquitto
  licencia: EPL-2.0 / EDL-1.0
  repo_url: https://github.com/eclipse/mosquitto
  version_fijada: null
  rol: Bus local de publicacion y suscripcion entre dispositivos y el nucleo.
  obligacion_licencia: aviso
  sustituible_por: []
  paquetes: [S, M, L, XL]
  notas: >-
    Autenticacion obligatoria. `allow_anonymous` en false sin excepcion, tambien en el banco de
    pruebas: una configuracion de banco relajada acaba copiada a produccion.

- id: zigbee2mqtt
  nombre: Zigbee2MQTT
  licencia: GPL-3.0
  repo_url: https://github.com/Koenkk/zigbee2mqtt
  version_fijada: null
  rol: Traduccion de protocolo Zigbee, desacoplando los dispositivos de concentradores propietarios.
  obligacion_licencia: fuente_si_modificado
  sustituible_por: [integracion-zigbee-nativa]
  paquetes: [S, M, L, XL]
  notas: >-
    GPL-3.0. Si lo modificamos y lo entregamos en hardware del cliente, eso es distribucion y hay que
    ofrecer la fuente correspondiente. Politica: no forkear; configurar y extender por mecanismos
    soportados. Ver docs/LICENCIAS.md.

- id: integracion-zigbee-nativa
  nombre: Integracion Zigbee incorporada en Home Assistant
  licencia: Apache-2.0
  repo_url: https://github.com/home-assistant/core
  version_fijada: null
  rol: Alternativa a Zigbee2MQTT dentro del propio nucleo.
  obligacion_licencia: aviso
  sustituible_por: [zigbee2mqtt]
  paquetes: [S, M]
  notas: >-
    Menos piezas moviles. Se elige por cliente y se registra la decision; no se mezclan las dos rutas
    sobre el mismo coordinador.

- id: zwave-js-ui
  nombre: Z-Wave JS UI
  licencia: MIT
  repo_url: https://github.com/zwave-js/zwave-js-ui
  version_fijada: null
  rol: Gestion de la red Z-Wave donde se utilice.
  obligacion_licencia: aviso
  sustituible_por: []
  paquetes: [M, L, XL]
  notas: >-
    Solo se despliega si hay un dispositivo que justifique una red Z-Wave. No se levanta por defecto.

- id: frigate
  nombre: Frigate NVR
  licencia: MIT
  repo_url: https://github.com/blakeblackshear/frigate
  version_fijada: null
  rol: Grabacion, decodificacion acelerada por hardware y deteccion local de objetos.
  obligacion_licencia: aviso
  sustituible_por: []
  paquetes: [S, M, L, XL]
  notas: >-
    Ruta por defecto de inferencia: OpenVINO sobre grafica Intel integrada. Sub-stream para deteccion,
    stream principal para grabacion. Retencion hibrida: continua corta mas eventos larga.

- id: go2rtc
  nombre: go2rtc
  licencia: MIT
  repo_url: https://github.com/AlexxIT/go2rtc
  version_fijada: null
  rol: Manejo de flujos de baja latencia y redistribucion a clientes.
  obligacion_licencia: aviso
  sustituible_por: []
  paquetes: [S, M, L, XL]
  notas: >-
    Evita que varios consumidores abran conexiones independientes contra la camara, que es una causa
    habitual de saturacion del sub-stream.

- id: esphome
  nombre: ESPHome
  licencia: GPL-3.0 / MIT (segun componente)
  repo_url: https://github.com/esphome/esphome
  version_fijada: null
  rol: Firmware totalmente local para nodos de infrarrojo, serie y sensores propios.
  obligacion_licencia: fuente_si_modificado
  sustituible_por: []
  paquetes: [M, L, XL]
  notas: >-
    Habilita el control local de mini-splits, que es un diferenciador frente a todo competidor de nube.
    Las configuraciones YAML propias no son obra derivada del firmware, pero cualquier parche al
    codigo si activa la obligacion. Ver docs/LICENCIAS.md.

- id: wireguard
  nombre: WireGuard
  licencia: GPL-2.0
  repo_url: https://www.wireguard.com/repositories/
  version_fijada: null
  rol: Tunel cifrado punto a punto para acceso remoto, sin exposicion de puertos entrantes.
  obligacion_licencia: fuente_si_modificado
  sustituible_por: []
  paquetes: [S, M, L, XL]
  notas: >-
    Las claves pertenecen al cliente. La empresa no conserva material de clave persistente de ninguna
    instalacion (ADR-005).

- id: plano-control-malla
  nombre: Plano de control de la malla (autoalojado u opcion comercial)
  licencia: BSD-3-Clause / comercial segun opcion
  repo_url: null
  version_fijada: null
  rol: Coordinacion de la superposicion WireGuard y distribucion de claves.
  obligacion_licencia: aviso
  sustituible_por: []
  paquetes: [S, M, L, XL]
  notas: >-
    Se ofrecen las dos opciones y se registra la eleccion en el archivo de cliente. Por defecto, la
    opcion autoalojada para el cliente cuya motivacion es la soberania: elimina al tercero a cambio de
    mas responsabilidad operativa. La opcion comercial exige suscripcion de empresa para uso
    comercial; confirmar condiciones vigentes antes de cotizarla.

- id: traefik
  nombre: Traefik
  licencia: MIT
  repo_url: https://github.com/traefik/traefik
  version_fijada: null
  rol: Terminacion TLS dentro de la propiedad.
  obligacion_licencia: aviso
  sustituible_por: [nginx]
  paquetes: [M, L, XL]
  notas: >-
    Certificados internos. No se abre ningun puerto entrante en el router: el acceso remoto entra por
    el tunel.

- id: nginx
  nombre: NGINX
  licencia: BSD-2-Clause
  repo_url: https://github.com/nginx/nginx
  version_fijada: null
  rol: Alternativa de proxy inverso y terminacion TLS.
  obligacion_licencia: aviso
  sustituible_por: [traefik]
  paquetes: [M, L, XL]
  notas: >-
    Se elige uno de los dos por cliente, nunca ambos.

- id: authelia
  nombre: Authelia
  licencia: Apache-2.0
  repo_url: https://github.com/authelia/authelia
  version_fijada: null
  rol: Inicio de sesion unico y doble factor en instalaciones grandes.
  obligacion_licencia: aviso
  sustituible_por: [authentik]
  paquetes: [L, XL]
  notas: >-
    Opcional. El doble factor sobre las cuentas administrativas es obligatorio con o sin este
    componente (docs/SEGURIDAD.md).

- id: authentik
  nombre: Authentik
  licencia: MIT
  repo_url: https://github.com/goauthentik/authentik
  version_fijada: null
  rol: Alternativa de identidad e inicio de sesion unico.
  obligacion_licencia: aviso
  sustituible_por: [authelia]
  paquetes: [L, XL]
  notas: >-
    Mas capaz y mas pesado que Authelia. Solo cuando el numero de usuarios o de servicios lo justifica.

- id: vaultwarden
  nombre: Vaultwarden
  licencia: AGPL-3.0
  repo_url: https://github.com/dani-garcia/vaultwarden
  version_fijada: null
  rol: Custodia de credenciales por cliente, entregada al cliente en el cierre del proyecto.
  obligacion_licencia: fuente_si_modificado
  sustituible_por: []
  paquetes: [S, M, L, XL]
  notas: >-
    AGPL-3.0: la obligacion de fuente correspondiente se activa incluso por uso en red si se modifica.
    Politica: no se modifica. Pieza central de ADR-005: las credenciales reales viven aqui, no en el
    repositorio, y la empresa no conserva copia tras la entrega.

- id: influxdb
  nombre: InfluxDB
