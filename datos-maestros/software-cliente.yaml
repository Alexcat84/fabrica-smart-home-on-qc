- id: crowdsec
  nombre: CrowdSec
  licencia: MIT
  repo_url: https://github.com/crowdsecurity/crowdsec
  version_fijada: null
  rol: Bloqueo por comportamiento en el perimetro.
  obligacion_licencia: aviso
  sustituible_por: []
  paquetes: [L, XL]
  notas: >-
    Configurar en modo local. Sin puertos entrantes abiertos la superficie ya es pequena; esto cubre
    el trafico que si entra por el tunel.

- id: ansible
  nombre: Ansible
  licencia: GPL-3.0
  repo_url: https://github.com/ansible/ansible
  version_fijada: null
  rol: Despliegue reproducible entre clientes. Herramienta interna de la empresa.
  obligacion_licencia: fuente_si_modificado
  sustituible_por: []
  paquetes: [S, M, L, XL]
  notas: >-
    Herramienta INTERNA: se ejecuta desde la estacion de trabajo de la empresa y no se entrega al
    cliente, por lo que no hay distribucion. Los roles propios son obra nuestra y se quedan en este
    repositorio privado.

- id: linux-minimo-con-contenedores
  nombre: Anfitrion Linux minimo con contenedores
  licencia: GPL-2.0 y otras segun distribucion
  repo_url: null
  version_fijada: null
  rol: Base alternativa a Home Assistant OS cuando el mismo equipo hace de controlador y de grabador.
  obligacion_licencia: aviso
  sustituible_por: [home-assistant-os]
  paquetes: [M, L, XL]
  notas: >-
    Ruta preferida cuando Frigate y Home Assistant comparten anfitrion, porque da control directo
    sobre el acceso a la grafica integrada y sobre el montaje de los discos de vigilancia. A cambio,
    las actualizaciones del sistema base pasan a ser responsabilidad de los roles de ansible/.
    La distribucion concreta se fija al estandarizar el banco de la empresa.
