- id: borgbackup
  nombre: BorgBackup
  licencia: BSD-3-Clause
  repo_url: https://github.com/borgbackup/borg
  version_fijada: null
  rol: Alternativa de respaldo cifrado con deduplicacion.
  obligacion_licencia: aviso
  sustituible_por: [restic]
  paquetes: [S, M, L, XL]
  notas: >-
    Se elige uno de los dos por cliente y se documenta en el as-built, porque determina el
    procedimiento de restauracion que el cliente puede ejecutar sin nosotros.

- id: rclone
  nombre: rclone
  licencia: MIT
  repo_url: https://github.com/rclone/rclone
  version_fijada: null
  rol: Transporte hacia el destino externo controlado por el cliente.
  obligacion_licencia: aviso
  sustituible_por: []
