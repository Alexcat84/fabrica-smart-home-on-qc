# Componentes de software INTERNOS de la empresa
#
# Corren en la estacion de trabajo de la empresa o en el banco. **Nunca se entregan al cliente.**
#
# Por eso NINGUNO genera obligacion de distribucion, por copyleft que sea su licencia. Ansible es
# GPL-3.0 y git es GPL-2.0, y da igual: la obligacion de estas licencias se dispara al **entregar**
# el software a un tercero, no al usarlo. Ver ADR-010 en docs/DECISIONES.md.
#
# Este archivo existe para poder afirmar eso con una lista delante, en lugar de con un razonamiento.
# Si algun dia un componente de aqui pasa a instalarse en el equipo del cliente, se mueve a
# software-cliente.yaml y en ese momento -no antes- adquiere su obligacion.
#
# `obligacion_licencia: ninguna` en todos, y es correcto: describe la obligacion PRACTICA de la
# empresa, que es lo que este campo significa.
---

- id: ansible
  nombre: Ansible
  licencia: GPL-3.0
  repo_url: https://github.com/ansible/ansible
  version_fijada: null
  rol: Despliegue reproducible entre clientes. Aprovisiona el controlador desde cero.
  obligacion_licencia: ninguna
  sustituible_por: []
  paquetes: [S, M, L, XL]
  se_entrega_al_cliente: false
  modificado_por_nosotros: false
  url_parche_publicado: null
  notas: >-
    EL CASO DE MANUAL DE ADR-010. Es GPL-3.0, la licencia mas copyleft del stack, y no genera
    ninguna obligacion: se ejecuta desde nuestra estacion de trabajo contra el anfitrion del cliente
    por SSH, y no queda instalado en el equipo que se le vende. No hay entrega, luego no hay
    distribucion. Los roles de herramientas-empresa/ansible/ son obra nuestra y se quedan en este
    repositorio privado.

