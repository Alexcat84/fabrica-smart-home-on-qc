  nombre: CPython
  licencia: PSF-2.0
  repo_url: https://github.com/python/cpython
  version_fijada: null
  rol: Interprete del generador, el validador, las calculadoras y el detector de secretos.
  obligacion_licencia: ninguna
  sustituible_por: []
  paquetes: [S, M, L, XL]
  se_entrega_al_cliente: false
  modificado_por_nosotros: false
  url_parche_publicado: null
  notas: >-
    Version minima 3.12: el codigo usa sintaxis de union de tipos y `dataclass` con `field`.
    Se fija junto al resto del banco (fila B-04).

- id: pyyaml
  nombre: PyYAML
  licencia: MIT
  repo_url: https://github.com/yaml/pyyaml
  version_fijada: null
  rol: Lectura de datos maestros, paquetes y archivos de cliente.
  obligacion_licencia: ninguna
  sustituible_por: []
  paquetes: [S, M, L, XL]
  se_entrega_al_cliente: false
  modificado_por_nosotros: false
  url_parche_publicado: null
  notas: >-
    Implementa YAML 1.1, donde `ON`, `OFF`, `YES` y `NO` sin comillas son booleanos. Ese
    comportamiento causo un fallo real en datos-maestros/proveedores.yaml, donde Ontario se leia
    como `true`. Lo detectaron los esquemas JSON, no una revision humana. Una implementacion de
    YAML 1.2 no tendria ese comportamiento, pero cambiar de libreria por esto seria desproporcionado:
    los esquemas ya cubren el riesgo y lo cubren para todos los campos, no solo para este.

