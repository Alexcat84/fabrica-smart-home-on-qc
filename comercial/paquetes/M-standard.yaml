# Paquete M - Standard
#
# Fuente: cap. 8.1, 8.2.1, 8.3.2 y 8.5 del plan de negocio.
# ADR-001: los valores de proyecto son INDICATIVOS. No se cotiza con ellos.
---
id: M
nombre: Standard
propiedad_objetivo: Vivienda unifamiliar aislada

capacidad:
  dispositivos_automatizados_min: 25
  dispositivos_automatizados_max: 60
  camaras_min: 4
  camaras_max: 6
  resolucion_camaras: mixta 2K y 4K

retencion:
  continua_dias: 7
  continua_dias_max: 10
  eventos_dias: 60
  politica: hibrida

controlador:
  tipo: micro escritorio empresarial reacondicionado
  ram_gb_min: 16
  ram_gb_max: 32
  candidatos: [dell-optiplex-micro-reacondicionado, lenovo-thinkcentre-tiny-reacondicionado, hp-elitedesk-mini-reacondicionado]
  inferencia: grafica Intel integrada (OpenVINO)

almacenamiento:
  nvme_sistema_gb: 500
  vigilancia_tb: 8
  redundancia: ninguna
  candidatos: [nvme-sistema, wd-purple-vigilancia, seagate-skyhawk-vigilancia]
  notas: >-
    Verificar con herramientas/calc_almacenamiento.py. Seis camaras a 8 Mbps con 14 dias de grabacion
    continua pediria unos 7,3 TB: por eso la politica hibrida es el ofrecimiento por defecto y no una
    concesion.

red:
  gateway: 1
  switch_poe_puertos: 16
  puntos_acceso: 2
  candidatos: [unifi-gateway, omada-gateway, switch-poe-plus-16, punto-acceso-wifi]
  patch_panel_obligatorio: true

energia:
  ups_va: 1500
  ups_camaras_dedicado: false
  circuito_dedicado_rack: true      # 15 A dedicado a partir de este nivel
  candidatos: [ups-cyberpower-senoidal, ups-apc-senoidal]
  carga_rack_w_min: 120
  carga_rack_w_max: 220

vlans:
  cantidad: 5
  presentes: [10, 20, 30, 40, 60]
  ausentes: [50]
  resuelto_por: ADR-009
  notas: >-
    Management (50) se despliega a partir del nivel L. En S y en M se pliega dentro de TRUSTED (10),
    no de Controller: el anfitrion del controlador es el objetivo de mayor valor de la instalacion,
    porque contiene las camaras, y no debe tener alcance administrativo sobre la pasarela ni los
    switches. El acceso administrativo sigue restringido al equipo autorizado declarado o a una
    sesion de soporte: la restriccion la aplica el cortafuegos, no la existencia de una VLAN
    separada. Ver ADR-009 y su enmienda de 2026-08-19 en docs/DECISIONES.md.

internet_minimo:
  bajada_mbps: 50
  subida_mbps: 15
  motivo: >-
    Modelo de tres flujos (ADR-012). Escenario vinculante: cuadricula de 5 camaras con dos visores
    (10,0) mas apertura de una camara sobre flujo medio (+1,5) => 11,5 Mbps. Se publica 15.
    SUBE DESDE LOS 10 PUBLICADOS ANTES: los 10 solo cubrian la cuadricula. Abrir sobre principal
    pediria 17,5 y es excepcion bajo demanda. Con camaras de DOS flujos el vinculante sube, porque
    la apertura sirve el principal.
  recalculado: "2026-08-19"
  provisional: true
  nota_provisional: >-
    PROVISIONAL hasta cerrar M-14. Sale de un perfil de camara calculado, no de camaras
    medidas. Sirve para cotizar; no es promesa. El numero que decide un diseno concreto es
    `red.subida_medida_mbps` de ese cliente, con su fecha y su metodo.
esfuerzo:
  instalacion_dias_min: 4
  instalacion_dias_max: 6

comercial:
  valor_proyecto_cad_min: 7000
  valor_proyecto_cad_max: 13000
  plan_cuidado_cad_mes: 45
  verificado: false
  notas: >-
    Indicativo. Nivel de referencia del negocio: es el paquete que genera EJEMPLO-demo.
