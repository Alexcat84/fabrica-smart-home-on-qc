[defaults]
inventory = inventario/
roles_path = roles/
host_key_checking = True
retry_files_enabled = False
stdout_callback = yaml
interpreter_python = auto_silent

# ADR-005: la contrasena del vault NUNCA se guarda en el repositorio. Se pide de forma interactiva
# o se lee de un archivo fuera del arbol, referenciado por variable de entorno.
# ansible-vault: ANSIBLE_VAULT_PASSWORD_FILE apuntando fuera del repositorio.

[ssh_connection]
pipelining = True
